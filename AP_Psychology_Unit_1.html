tion><option value="20">隨機 20 題</option><option value="30">隨機 30 題</option><option value="90">所有符合條件的題目</option></select><button onclick="newQuiz()">重新抽題</button></div><div id="status" class="muted"></div><div class="progress"><div id="bar"></div></div><div id="result"></div><div id="quiz"></div><button id="submit" class="primary" onclick="submitQuiz()">交卷並顯示四選項解析</button></main></div><footer>Independent original educational practice · 非 College Board 或教材出版社官方網站 · 作答紀錄僅保存在此瀏覽器的 localStorage</footer><script>const CURRENT_UNIT=1;const UNITS=[["Science Practices", ["History of Psychology", "Research Methods", "Statistics"]], ["Biological Bases of Behavior", ["Biological Bases of Behavior", "States of Consciousness", "Sensation"]], ["Cognition", ["Perception", "Thinking and Creativity", "Memory", "Testing and Individual Differences"]], ["Development and Learning", ["Developmental Psychology", "Learning"]], ["Social Psychology, Personality, Motivation and Emotion", ["Social Psychology", "Personality", "Motivation and Emotion"]], ["Mental and Physical Health", ["Health Psychology", "Psychological Disorders", "Treatment of Psychological Disorders"]]],BANK=[{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Easy","skill":"Concept Application","stem":"A child inherits one allele for a trait from each parent. What is the child’s specific combination of alleles called?","options":["Genotype","Phenotype","Natural selection","Heritability"],"answer":0,"concept":"Genotype 指個體的等位基因組合；題目描述的是遺傳組成而非可觀察表現。","explanations":["正確。Genotype 指個體的等位基因組合；題目描述的是遺傳組成而非可觀察表現。","不符合。Phenotype 指「可觀察的表現」；題目描述的線索更符合 Genotype，而不是此選項。","不符合。Natural selection 指「世代間的選汰」；題目描述的線索更符合 Genotype，而不是此選項。","不符合。Heritability 指「族群變異中的遺傳比例」；題目描述的線索更符合 Genotype，而不是此選項。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Medium","skill":"Concept Application","stem":"Two siblings share many genes but differ in height partly because of nutrition. Which distinction best explains this?","options":["Axon versus dendrite","Sympathetic versus parasympathetic","Sensation versus perception","Genotype versus phenotype"],"answer":3,"concept":"Genotype 是基因組合，phenotype 是基因與環境共同作用後的表現。","explanations":["不符合。Axon versus dendrite 指「神經傳導與接收結構的差別」；題目描述的線索更符合 Genotype versus phenotype，而不是此選項。","不符合。Sympathetic versus parasympathetic 指「自律神經的兩個分支」；題目描述的線索更符合 Genotype versus phenotype，而不是此選項。","不符合。Sensation versus perception 指「感覺接收與知覺詮釋的區別」；題目描述的線索更符合 Genotype versus phenotype，而不是此選項。","正確。Genotype 是基因組合，phenotype 是基因與環境共同作用後的表現。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Hard","skill":"Concept Application","stem":"Researchers estimate that 60% of variation in a trait within a population is associated with genetic variation. This statistic is called","options":["A dominant allele","Neuroplasticity","Heritability","Genetic determinism"],"answer":2,"concept":"Heritability 描述特定族群、環境下的變異比例，不代表個人的特質有 60% 由基因決定。","explanations":["不符合。A dominant allele 指「顯性等位基因」；題目描述的線索更符合 Heritability，而不是此選項。","不符合。Neuroplasticity 指「神經系統因經驗改變」；題目描述的線索更符合 Heritability，而不是此選項。","正確。Heritability 描述特定族群、環境下的變異比例，不代表個人的特質有 60% 由基因決定。","不符合。Genetic determinism 指「基因完全決定結果的主張」；題目描述的線索更符合 Heritability，而不是此選項。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Easy","skill":"Research Methods","stem":"A study compares identical twins raised apart to investigate genetic contributions to personality. Which design is being used?","options":["Operant conditioning","Twin study","Randomized controlled trial","Case study only"],"answer":1,"concept":"Twin study 利用同卵雙胞胎基因高度相似的特性，評估遺傳與環境的關聯。","explanations":["不符合。Operant conditioning 指「行為後果造成的學習」；題目描述的線索更符合 Twin study，而不是此選項。","正確。Twin study 利用同卵雙胞胎基因高度相似的特性，評估遺傳與環境的關聯。","不符合。Randomized controlled trial 指「隨機分派的介入研究」；題目描述的線索更符合 Twin study，而不是此選項。","不符合。Case study only 指「深入觀察單一或少數案例」；題目描述的線索更符合 Twin study，而不是此選項。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Medium","skill":"Concept Application","stem":"A neuron receives signals from several neighboring cells. Which structures receive most of these inputs?","options":["Dendrites","Axon terminals","Myelin sheath","Synaptic vesicles"],"answer":0,"concept":"Dendrites（樹突）主要接收來自其他神經元的訊息。","explanations":["正確。Dendrites（樹突）主要接收來自其他神經元的訊息。","不符合。Axon terminals 指「釋放神經傳導物質的軸突末端」；題目描述的線索更符合 Dendrites，而不是此選項。","不符合。Myelin sheath 指「加速傳導的髓鞘」；題目描述的線索更符合 Dendrites，而不是此選項。","不符合。Synaptic vesicles 指「儲存神經傳導物質的囊泡」；題目描述的線索更符合 Dendrites，而不是此選項。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Hard","skill":"Concept Application","stem":"A nerve impulse travels from the cell body toward the terminals. Along which structure does it propagate?","options":["Dendrite","Soma nucleus","Synaptic cleft","Axon"],"answer":3,"concept":"Axon（軸突）傳導 action potential，通常朝向末端傳遞。","explanations":["不符合。Dendrite 指「Dendrite」；題目描述的線索更符合 Axon，而不是此選項。","不符合。Soma nucleus 指「細胞體內的細胞核」；題目描述的線索更符合 Axon，而不是此選項。","不符合。Synaptic cleft 指「神經元之間的突觸間隙」；題目描述的線索更符合 Axon，而不是此選項。","正確。Axon（軸突）傳導 action potential，通常朝向末端傳遞。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Easy","skill":"Concept Application","stem":"A disease damages the insulating covering around axons, slowing neural signaling. Which structure is affected?","options":["Pituitary gland","Cerebral cortex","Myelin sheath","Synaptic cleft"],"answer":2,"concept":"Myelin sheath（髓鞘）幫助加快神經訊號的跳躍式傳導。","explanations":["不符合。Pituitary gland 指「分泌多種激素的腦下垂體」；題目描述的線索更符合 Myelin sheath，而不是此選項。","不符合。Cerebral cortex 指「大腦皮質」；題目描述的線索更符合 Myelin sheath，而不是此選項。","正確。Myelin sheath（髓鞘）幫助加快神經訊號的跳躍式傳導。","不符合。Synaptic cleft 指「神經元之間的突觸間隙」；題目描述的線索更符合 Myelin sheath，而不是此選項。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Medium","skill":"Concept Application","stem":"A neuron fires only after its membrane reaches a critical level of depolarization. This level is the","options":["Absolute refractory period","Threshold","Resting potential","Reuptake rate"],"answer":1,"concept":"Threshold（閾值）是觸發 action potential 所需的膜電位條件。","explanations":["不符合。Absolute refractory period 指「神經元不能再次放電的短暫時期」；題目描述的線索更符合 Threshold，而不是此選項。","正確。Threshold（閾值）是觸發 action potential 所需的膜電位條件。","不符合。Resting potential 指「未放電時的膜電位」；題目描述的線索更符合 Threshold，而不是此選項。","不符合。Reuptake rate 指「神經傳導物質回收速率」；題目描述的線索更符合 Threshold，而不是此選項。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Hard","skill":"Concept Application","stem":"A weak stimulus and a strong stimulus both trigger impulses of similar size in one neuron. This demonstrates","options":["All-or-none principle","Habituation","Opponent-process theory","Synaptic pruning"],"answer":0,"concept":"All-or-none principle 指單次 action potential 的振幅不隨刺激強度改變。","explanations":["正確。All-or-none principle 指單次 action potential 的振幅不隨刺激強度改變。","不符合。Habituation 指「對重複刺激反應減弱」；題目描述的線索更符合 All-or-none principle，而不是此選項。","不符合。Opponent-process theory 指「對抗色彩或對立過程的理論」；題目描述的線索更符合 All-or-none principle，而不是此選項。","不符合。Synaptic pruning 指「較少使用的突觸連結被修剪」；題目描述的線索更符合 All-or-none principle，而不是此選項。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Easy","skill":"Concept Application","stem":"Immediately after an action potential, a neuron cannot fire another impulse regardless of stimulus strength. This is the","options":["Relative refractory period","Resting potential","Synaptic delay","Absolute refractory period"],"answer":3,"concept":"Absolute refractory period 期間無法再觸發新的 action potential。","explanations":["不符合。Relative refractory period 指「需要較強刺激才能再次放電的時期」；題目描述的線索更符合 Absolute refractory period，而不是此選項。","不符合。Resting potential 指「未放電時的膜電位」；題目描述的線索更符合 Absolute refractory period，而不是此選項。","不符合。Synaptic delay 指「訊號跨越突觸的時間差」；題目描述的線索更符合 Absolute refractory period，而不是此選項。","正確。Absolute refractory period 期間無法再觸發新的 action potential。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Medium","skill":"Concept Application","stem":"After a neurotransmitter is released, the sending neuron takes some molecules back into its terminal. This process is","options":["Myelination","Lateralization","Reuptake","Transduction"],"answer":2,"concept":"Reuptake（再攝取）是突觸前神經元回收 neurotransmitter 的機制。","explanations":["不符合。Myelination 指「髓鞘形成」；題目描述的線索更符合 Reuptake，而不是此選項。","不符合。Lateralization 指「左右半球功能偏側化」；題目描述的線索更符合 Reuptake，而不是此選項。","正確。Reuptake（再攝取）是突觸前神經元回收 neurotransmitter 的機制。","不符合。Transduction 指「感覺能量轉為神經訊號」；題目描述的線索更符合 Reuptake，而不是此選項。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Hard","skill":"Concept Application","stem":"A drug binds to dopamine receptors and activates them similarly to dopamine. The drug is a(n)","options":["Inhibitory interneuron","Agonist","Antagonist","Reuptake inhibitor only"],"answer":1,"concept":"Agonist（促效劑）模仿或增強受體的活化作用。","explanations":["不符合。Inhibitory interneuron 指「抑制其他神經元的中間神經元」；題目描述的線索更符合 Agonist，而不是此選項。","正確。Agonist（促效劑）模仿或增強受體的活化作用。","不符合。Antagonist 指「阻斷受體或降低其作用」；題目描述的線索更符合 Agonist，而不是此選項。","不符合。Reuptake inhibitor only 指「阻止神經傳導物質回收的藥物」；題目描述的線索更符合 Agonist，而不是此選項。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Easy","skill":"Concept Application","stem":"A medication occupies a receptor and prevents a neurotransmitter from activating it. It acts as a(n)","options":["Antagonist","Agonist","Hormone","Action potential"],"answer":0,"concept":"Antagonist（拮抗劑）阻斷或降低受體被活化的效果。","explanations":["正確。Antagonist（拮抗劑）阻斷或降低受體被活化的效果。","不符合。Agonist 指「活化受體或增強傳導物質作用」；題目描述的線索更符合 Antagonist，而不是此選項。","不符合。Hormone 指「經血液運送的化學訊號」；題目描述的線索更符合 Antagonist，而不是此選項。","不符合。Action potential 指「沿軸突傳播的電訊號」；題目描述的線索更符合 Antagonist，而不是此選項。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Medium","skill":"Concept Application","stem":"A student jerks a hand away from a hot pan before consciously identifying the heat. Which pathway coordinates the immediate response?","options":["Occipital cortex only","Endocrine feedback loop","Corpus callosum","Spinal reflex arc"],"answer":3,"concept":"Spinal reflex arc（脊髓反射弧）能迅速處理撤手反射。","explanations":["不符合。Occipital cortex only 指「主要處理視覺的枕葉皮質」；題目描述的線索更符合 Spinal reflex arc，而不是此選項。","不符合。Endocrine feedback loop 指「激素調節的回饋迴路」；題目描述的線索更符合 Spinal reflex arc，而不是此選項。","不符合。Corpus callosum 指「連接左右半球的胼胝體」；題目描述的線索更符合 Spinal reflex arc，而不是此選項。","正確。Spinal reflex arc（脊髓反射弧）能迅速處理撤手反射。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Hard","skill":"Concept Application","stem":"A runner’s heart rate increases and digestion slows when a race begins. Which division is most active?","options":["Somatic sensory system","Central nervous system alone","Sympathetic nervous system","Parasympathetic nervous system"],"answer":2,"concept":"Sympathetic nervous system 啟動 fight-or-flight 的生理反應。","explanations":["不符合。Somatic sensory system 指「身體感覺訊息的傳入系統」；題目描述的線索更符合 Sympathetic nervous system，而不是此選項。","不符合。Central nervous system alone 指「腦與脊髓組成的中樞神經系統」；題目描述的線索更符合 Sympathetic nervous system，而不是此選項。","正確。Sympathetic nervous system 啟動 fight-or-flight 的生理反應。","不符合。Parasympathetic nervous system 指「副交感神經的休息消化反應」；題目描述的線索更符合 Sympathetic nervous system，而不是此選項。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Easy","skill":"Concept Application","stem":"After a stressful presentation, a student’s heart rate falls and digestion resumes. Which division predominates?","options":["Spinal reflex arc","Parasympathetic nervous system","Sympathetic nervous system","Somatic motor system"],"answer":1,"concept":"Parasympathetic nervous system 促進 rest-and-digest 的恢復狀態。","explanations":["不符合。Spinal reflex arc 指「脊髓反射迴路」；題目描述的線索更符合 Parasympathetic nervous system，而不是此選項。","正確。Parasympathetic nervous system 促進 rest-and-digest 的恢復狀態。","不符合。Sympathetic nervous system 指「交感神經的應急反應」；題目描述的線索更符合 Parasympathetic nervous system，而不是此選項。","不符合。Somatic motor system 指「控制骨骼肌的體神經運動系統」；題目描述的線索更符合 Parasympathetic nervous system，而不是此選項。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Medium","skill":"Concept Application","stem":"A person deliberately lifts a cup using skeletal muscles. Which part of the peripheral nervous system controls this?","options":["Somatic nervous system","Autonomic nervous system","Sympathetic branch","Endocrine system"],"answer":0,"concept":"Somatic nervous system 控制自主的骨骼肌動作。","explanations":["正確。Somatic nervous system 控制自主的骨骼肌動作。","不符合。Autonomic nervous system 指「調控內臟與腺體的自律神經系統」；題目描述的線索更符合 Somatic nervous system，而不是此選項。","不符合。Sympathetic branch 指「自律神經的交感分支」；題目描述的線索更符合 Somatic nervous system，而不是此選項。","不符合。Endocrine system 指「透過激素在血液中傳遞訊號的系統」；題目描述的線索更符合 Somatic nervous system，而不是此選項。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Hard","skill":"Concept Application","stem":"A patient has trouble coordinating movement and maintaining balance after a brain injury. Which region is most likely affected?","options":["Amygdala","Hypothalamus","Hippocampus","Cerebellum"],"answer":3,"concept":"Cerebellum（小腦）參與平衡、協調與動作精準度。","explanations":["不符合。Amygdala 指「杏仁核的情緒威脅處理」；題目描述的線索更符合 Cerebellum，而不是此選項。","不符合。Hypothalamus 指「下視丘的恆定調節」；題目描述的線索更符合 Cerebellum，而不是此選項。","不符合。Hippocampus 指「海馬迴的新記憶形成」；題目描述的線索更符合 Cerebellum，而不是此選項。","正確。Cerebellum（小腦）參與平衡、協調與動作精準度。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Easy","skill":"Concept Application","stem":"A brainstem injury disrupts breathing and heart-rate regulation. Which structure is most directly implicated?","options":["Occipital lobe","Corpus callosum","Medulla","Thalamus"],"answer":2,"concept":"Medulla（延腦）參與呼吸、心率等維生功能調節。","explanations":["不符合。Occipital lobe 指「枕葉的視覺處理」；題目描述的線索更符合 Medulla，而不是此選項。","不符合。Corpus callosum 指「連接左右半球的胼胝體」；題目描述的線索更符合 Medulla，而不是此選項。","正確。Medulla（延腦）參與呼吸、心率等維生功能調節。","不符合。Thalamus 指「視丘的感覺中繼」；題目描述的線索更符合 Medulla，而不是此選項。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Medium","skill":"Concept Application","stem":"A person is alert and able to sustain wakefulness due partly to a network running through the brainstem. Which system is involved?","options":["Primary visual cortex","Reticular formation","Broca’s area","Hippocampus"],"answer":1,"conce ard","skill":"Concept Application","stem":"A surgeon severs the major fiber tract connecting the two cerebral hemispheres. Which structure is cut?","options":["Hippocampus","Thalamus","Corpus callosum","Reticular formation"],"answer":2,"concept":"Corpus callosum（胼胝體）連接左右大腦半球。","explanations":["不符合。Hippocampus 指「海馬迴的新記憶形成」；題目描述的線索更符合 Corpus callosum，而不是此選項。","不符合。Thalamus 指「視丘的感覺中繼」；題目描述的線索更符合 Corpus callosum，而不是此選項。","正確。Corpus callosum（胼胝體）連接左右大腦半球。","不符合。Reticular formation 指「腦幹網狀結構的警覺調控」；題目描述的線索更符合 Corpus callosum，而不是此選項。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Easy","skill":"Concept Application","stem":"A patient loses some voluntary control of the right hand following damage to the left frontal lobe. Which region is involved?","options":["Olfactory bulb","Primary motor cortex","Primary visual cortex","Auditory cortex"],"answer":1,"concept":"Primary motor cortex 參與對側隨意動作控制。","explanations":["不符合。Olfactory bulb 指「嗅球」；題目描述的線索更符合 Primary motor cortex，而不是此選項。","正確。Primary motor cortex 參與對側隨意動作控制。","不符合。Primary visual cortex 指「初級視覺皮質」；題目描述的線索更符合 Primary motor cortex，而不是此選項。","不符合。Auditory cortex 指「聽覺皮質」；題目描述的線索更符合 Primary motor cortex，而不是此選項。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Medium","skill":"Research Methods","stem":"A researcher uses a technique that tracks blood-oxygen changes while participants solve puzzles. Which tool is being used?","options":["fMRI","EEG","CT scan","Lesion study"],"answer":0,"concept":"fMRI 利用血氧相關訊號推估不同腦區活動。","explanations":["正確。fMRI 利用血氧相關訊號推估不同腦區活動。","不符合。EEG 指「頭皮電極記錄的電活動」；題目描述的線索更符合 fMRI，而不是此選項。","不符合。CT scan 指「X 光斷層結構影像」；題目描述的線索更符合 fMRI，而不是此選項。","不符合。Lesion study 指「研究腦損傷與功能的關聯」；題目描述的線索更符合 fMRI，而不是此選項。"]},{"unit":1,"chapter":"Biological Bases of Behavior","difficulty":"Hard","skill":"Concept Application","stem":"A patient’s adrenal glands release epinephrine during an emergency. Which communication system is involved?","options":["Somatic motor system","Sensory cortex","Spinal reflex arc","Endocrine system"],"answer":3,"concept":"Endocrine system（內分泌系統）透過血液運送 hormones，例如 epinephrine。","explanations":["不符合。Somatic motor system 指「控制骨骼肌的體神經運動系統」；題目描述的線索更符合 Endocrine system，而不是此選項。","不符合。Sensory cortex 指「處理身體感覺的皮質」；題目描述的線索更符合 Endocrine system，而不是此選項。","不符合。Spinal reflex arc 指「脊髓反射迴路」；題目描述的線索更符合 Endocrine system，而不是此選項。","正確。Endocrine system（內分泌系統）透過血液運送 hormones，例如 epinephrine。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Easy","skill":"Research Methods","stem":"An EEG shows prominent alpha waves while a person is awake, calm, and resting with eyes closed. Which state best fits?","options":["General anesthesia","Relaxed wakefulness","Deep N3 sleep","REM sleep"],"answer":1,"concept":"Alpha waves 常與清醒但放鬆、閉眼的狀態有關。","explanations":["不符合。General anesthesia 指「全身麻醉狀態」；題目描述的線索更符合 Relaxed wakefulness，而不是此選項。","正確。Alpha waves 常與清醒但放鬆、閉眼的狀態有關。","不符合。Deep N3 sleep 指「N3 深度慢波睡眠」；題目描述的線索更符合 Relaxed wakefulness，而不是此選項。","不符合。REM sleep 指「快速動眼睡眠」；題目描述的線索更符合 Relaxed wakefulness，而不是此選項。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Medium","skill":"Concept Application","stem":"A sleeper is difficult to awaken and shows prominent delta waves. Which sleep stage is most likely?","options":["N3 slow-wave sleep","N1 sleep","REM sleep","Relaxed wakefulness"],"answer":0,"concept":"N3 為 slow-wave sleep，EEG 常呈現高振幅低頻 delta waves。","explanations":["正確。N3 為 slow-wave sleep，EEG 常呈現高振幅低頻 delta waves。","不符合。N1 sleep 指「N1 入睡初期」；題目描述的線索更符合 N3 slow-wave sleep，而不是此選項。","不符合。REM sleep 指「快速動眼睡眠」；題目描述的線索更符合 N3 slow-wave sleep，而不是此選項。","不符合。Relaxed wakefulness 指「放鬆清醒狀態」；題目描述的線索更符合 N3 slow-wave sleep，而不是此選項。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Hard","skill":"Concept Application","stem":"A student briefly feels as if falling while drifting into sleep. Which stage commonly includes this experience?","options":["N3 sleep","REM sleep","Fully alert wakefulness","N1 sleep"],"answer":3,"concept":"N1 是入睡初期，可能出現 hypnic jerk 或入睡幻覺。","explanations":["不符合。N3 sleep 指「N3 sleep」；題目描述的線索更符合 N1 sleep，而不是此選項。","不符合。REM sleep 指「快速動眼睡眠」；題目描述的線索更符合 N1 sleep，而不是此選項。","不符合。Fully alert wakefulness 指「高度警覺清醒」；題目描述的線索更符合 N1 sleep，而不是此選項。","正確。N1 是入睡初期，可能出現 hypnic jerk 或入睡幻覺。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Easy","skill":"Research Methods","stem":"A sleep laboratory detects sleep spindles and K-complexes. Which stage is the participant in?","options":["N3 sleep","REM sleep","N2 sleep","N1 sleep"],"answer":2,"concept":"N2 的典型 EEG 特徵為 sleep spindles 與 K-complexes。","explanations":["不符合。N3 sleep 指「N3 sleep」；題目描述的線索更符合 N2 sleep，而不是此選項。","不符合。REM sleep 指「快速動眼睡眠」；題目描述的線索更符合 N2 sleep，而不是此選項。","正確。N2 的典型 EEG 特徵為 sleep spindles 與 K-complexes。","不符合。N1 sleep 指「N1 入睡初期」；題目描述的線索更符合 N2 sleep，而不是此選項。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Medium","skill":"Concept Application","stem":"A sleeper shows rapid eye movements, vivid dreams, and reduced skeletal muscle tone. Which stage is indicated?","options":["N1 sleep","REM sleep","N3 sleep","N2 sleep"],"answer":1,"concept":"REM sleep 常有 rapid eye movements、鮮明夢境與肌肉張力下降。","explanations":["不符合。N1 sleep 指「N1 入睡初期」；題目描述的線索更符合 REM sleep，而不是此選項。","正確。REM sleep 常有 rapid eye movements、鮮明夢境與肌肉張力下降。","不符合。N3 sleep 指「N3 sleep」；題目描述的線索更符合 REM sleep，而不是此選項。","不符合。N2 sleep 指「N2 睡眠，具有睡眠紡錘波」；題目描述的線索更符合 REM sleep，而不是此選項。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Hard","skill":"Concept Application","stem":"During a normal night, the proportion of REM sleep generally becomes larger in which portion of the night?","options":["Later sleep cycles","Only the first 10 minutes","Only the first N3 period","Only while awake"],"answer":0,"concept":"REM periods 通常在後半夜逐漸延長。","explanations":["正確。REM periods 通常在後半夜逐漸延長。","不符合。Only the first 10 minutes 指「僅在最初十分鐘」；題目描述的線索更符合 Later sleep cycles，而不是此選項。","不符合。Only the first N3 period 指「僅在最初 N3 階段」；題目描述的線索更符合 Later sleep cycles，而不是此選項。","不符合。Only while awake 指「僅清醒時」；題目描述的線索更符合 Later sleep cycles，而不是此選項。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Easy","skill":"Concept Application","stem":"A student regularly sleeps six hours on weekdays and ten hours on weekends. The longer weekend sleep may reflect","options":["REM behavior disorder","Narcolepsy","Circadian entrainment","Sleep debt"],"answer":3,"concept":"Sleep debt（睡眠債）是長期睡眠不足累積的需求。","explanations":["不符合。REM behavior disorder 指「REM 期肌肉抑制異常」；題目描述的線索更符合 Sleep debt，而不是此選項。","不符合。Narcolepsy 指「猝睡症的日間睡眠發作」；題目描述的線索更符合 Sleep debt，而不是此選項。","不符合。Circadian entrainment 指「晝夜節律與環境同步」；題目描述的線索更符合 Sleep debt，而不是此選項。","正確。Sleep debt（睡眠債）是長期睡眠不足累積的需求。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Medium","skill":"Concept Application","stem":"A traveler flies across several time zones and feels sleepy at local noon. What is most directly disrupted?","options":["Sensory adaptation","Operant conditioning","Circadian rhythm","Absolute refractory period"],"answer":2,"concept":"Circadian rhythm（晝夜節律）受跨時區旅行干擾，造成 jet lag。","explanations":["不符合。Sensory adaptation 指「持續刺激下感覺反應減弱」；題目描述的線索更符合 Circadian rhythm，而不是此選項。","不符合。Operant conditioning 指「行為後果造成的學習」；題目描述的線索更符合 Circadian rhythm，而不是此選項。","正確。Circadian rhythm（晝夜節律）受跨時區旅行干擾，造成 jet lag。","不符合。Absolute refractory period 指「神經元不能再次放電的短暫時期」；題目描述的線索更符合 Circadian rhythm，而不是此選項。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Hard","skill":"Concept Application","stem":"A student feels sleepy when evening light decreases because the pineal gland releases more","options":["Acetylcholine","Melatonin","Cortisol","Dopamine"],"answer":1,"concept":"Melatonin（褪黑激素）與光暗週期及睡眠時機有關。","explanations":["不符合。Acetylcholine 指「參與肌肉控制與注意等的傳導物質」；題目描述的線索更符合 Melatonin，而不是此選項。","正確。Melatonin（褪黑激素）與光暗週期及睡眠時機有關。","不符合。Cortisol 指「壓力反應相關的皮質醇」；題目描述的線索更符合 Melatonin，而不是此選項。","不符合。Dopamine 指「與獎賞及動作等有關的傳導物質」；題目描述的線索更符合 Melatonin，而不是此選項。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Easy","skill":"Concept Application","stem":"A person’s internal clock is synchronized by daily morning sunlight. This process is called","options":["Entrainment","Extinction","Generalization","Habituation"],"answer":0,"concept":"Entrainment（同步化）是環境時間線索調整內在節律。","explanations":["正確。Entrainment（同步化）是環境時間線索調整內在節律。","不符合。Extinction 指「已學反應逐漸減弱」；題目描述的線索更符合 Entrainment，而不是此選項。","不符合。Generalization 指「反應延伸到相似刺激」；題目描述的線索更符合 Entrainment，而不是此選項。","不符合。Habituation 指「對重複刺激反應減弱」；題目描述的線索更符合 Entrainment，而不是此選項。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Medium","skill":"Concept Application","stem":"A patient repeatedly stops breathing briefly during sleep and wakes unrefreshed. Which condition is most consistent?","options":["Narcolepsy","Insomnia only","REM rebound","Sleep apnea"],"answer":3,"concept":"Sleep apnea（睡眠呼吸中止症）會反覆影響呼吸並破壞睡眠品質。","explanations":["不符合。Narcolepsy 指「猝睡症的日間睡眠發作」；題目描述的線索更符合 Sleep apnea，而不是此選項。","不符合。Insomnia only 指「Insomnia only」；題目描述的線索更符合 Sleep apnea，而不是此選項。","不符合。REM rebound 指「REM 受剝奪後的補償性增加」；題目描述的線索更符合 Sleep apnea，而不是此選項。","正確。Sleep apnea（睡眠呼吸中止症）會反覆影響呼吸並破壞睡眠品質。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Hard","skill":"Concept Application","stem":"A student has sudden, uncontrollable daytime sleep episodes. Which disorder is most relevant?","options":["Night terror","Somnambulism","Narcolepsy","Sleep apnea"],"answer":2,"concept":"Narcolepsy（猝睡症）以日間難以抗拒的睡意與睡眠發作為特徵。","explanations":["不符合。Night terror 指「深睡期的夜驚」；題目描述的線索更符合 Narcolepsy，而不是此選項。","不符合。Somnambulism 指「夢遊」；題目描述的線索更符合 Narcolepsy，而不是此選項。","正確。Narcolepsy（猝睡症）以日間難以抗拒的睡意與睡眠發作為特徵。","不符合。Sleep apnea 指「睡眠期間反覆呼吸中止」；題目描述的線索更符合 Narcolepsy，而不是此選項。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Easy","skill":"Concept Application","stem":"A person reports persistent difficulty falling asleep despite adequate opportunity to sleep. Which complaint best fits?","options":["REM behavior disorder","Insomnia","Sleep apnea","Narcolepsy"],"answer":1,"concept":"Insomnia（失眠）包括入睡或維持睡眠困難。","explanations":["不符合。REM behavior disorder 指「REM 期肌肉抑制異常」；題目描述的線索更符合 Insomnia，而不是此選項。","正確。Insomnia（失眠）包括入睡或維持睡眠困難。","不符合。Sleep apnea 指「睡眠期間反覆呼吸中止」；題目描述的線索更符合 Insomnia，而不是此選項。","不符合。Narcolepsy 指「猝睡症的日間睡眠發作」；題目描述的線索更符合 Insomnia，而不是此選項。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Medium","skill":"Concept Application","stem":"A child screams during deep sleep, appears confused, and remembers little the next morning. Which event is most likely?","options":["Sleep terror","Typical REM nightmare","Lucid dream","Narcoleptic episode"],"answer":0,"concept":"Sleep terrors（夜驚）通常發生於 NREM 深睡期，醒後記憶有限。","explanations":["正確。Sleep terrors（夜驚）通常發生於 NREM 深睡期，醒後記憶有限。","不符合。Typical REM nightmare 指「REM 期可能發生的惡夢」；題目描述的線索更符合 Sleep terror，而不是此選項。","不符合。Lucid dream 指「知道自己正在作夢」；題目描述的線索更符合 Sleep terror，而不是此選項。","不符合。Narcoleptic episode 指「猝睡發作」；題目描述的線索更符合 Sleep terror，而不是此選項。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Hard","skill":"Concept Application","stem":"A sleeper walks around the house during the first third of the night. Which stage is most often associated with sleepwalking?","options":["REM sleep","Relaxed wakefulness","N1 only","N3 sleep"],"answer":3,"concept":"Sleepwalking（夢遊）常見於 N3 的 NREM 睡眠。","explanations":["不符合。REM sleep 指「快速動眼睡眠」；題目描述的線索更符合 N3 sleep，而不是此選項。","不符合。Relaxed wakefulness 指「放鬆清醒狀態」；題目描述的線索更符合 N3 sleep，而不是此選項。","不符合。N1 only 指「N1 only」；題目描述的線索更符合 N3 sleep，而不是此選項。","正確。Sleepwalking（夢遊）常見於 N3 的 NREM 睡眠。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Easy","skill":"Concept Application","stem":"A patient physically acts out dreams because normal REM muscle paralysis is reduced. Which condition is suggested?","options":["Night terror","Insomnia","REM sleep behavior disorder","Sleep apnea"],"answer":2,"concept":"REM sleep behavior disorder 涉及 REM 期正常肌肉抑制不足。","explanations":["不符合。Night terror 指「深睡期的夜驚」；題目描述的線索更符合 REM sleep behavior disorder，而不是此選項。","不符合。Insomnia 指「入睡或維持睡眠困難」；題目描述的線索更符合 REM sleep behavior disorder，而不是此選項。","正確。REM sleep behavior disorder 涉及 REM 期正常肌肉抑制不足。","不符合。Sleep apnea 指「睡眠期間反覆呼吸中止」；題目描述的線索更符合 REM sleep behavior disorder，而不是此選項。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Medium","skill":"Concept Application","stem":"After several nights with REM sleep repeatedly interrupted, a participant spends more time in REM. This is","options":["State-dependent learning","REM rebound","Sensory adaptation","Synaptic pruning"],"answer":1,"concept":"REM rebound 指 REM 睡眠受剝奪後出現的補償性增加。","explanations":["不符合。State-dependent learning 指「狀態相似有利記憶提取」；題目描述的線索更符合 REM rebound，而不是此選項。","正確。REM rebound 指 REM 睡眠受剝奪後出現的補償性增加。","不符合。Sensory adaptation 指「持續刺激下感覺反應減弱」；題目描述的線索更符合 REM rebound，而不是此選項。","不符合。Synaptic pruning 指「較少使用的突觸連結被修剪」；題目描述的線索更符合 REM rebound，而不是此選項。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Hard","skill":"Research Methods","stem":"A researcher proposes that dreaming helps consolidate memories and process experiences. This is a","options":["Memory consolidation account","Activation-synthesis account","Opponent-process account","Psychosexual account"],"answer":0,"concept":"Memory consolidation account 強調夢與睡眠在記憶整合上的可能作用。","explanations":["正確。Memory consolidation account 強調夢與睡眠在記憶整合上的可能作用。","不符合。Activation-synthesis account 指「對自發神經活動加以詮釋的夢理論」；題目描述的線索更符合 Memory consolidation account，而不是此選項。","不符合。Opponent-process account 指「相反過程相互調節的解釋」；題目描述的線索更符合 Memory consolidation account，而不是此選項。","不符合。Psychosexual account 指「心理性慾發展的理論」；題目描述的線索更符合 Memory consolidation account，而不是此選項。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Easy","skill":"Concept Application","stem":"A theory suggests dreams are the cortex’s attempt to interpret spontaneous neural activity. Which theory is this?","options":["Social learning theory","Drive-reduction theory","Signal detection theory","Activation-synthesis theory"],"answer":3,"concept":"Activation-synthesis theory 認為夢是大腦對內生神經活動的解讀。","explanations":["不符合。Social learning theory 指「透過觀察與模仿學習」；題目描述的線索更符合 Activation-synthesis theory，而不是此選項。","不符合。Drive-reduction t lective attention（選擇性注意）能從多個刺激中優先處理一部分。","不符合。Circadian rhythm 指「約 24 小時的生理節律」；題目描述的線索更符合 Selective attention，而不是此選項。","不符合。REM rebound 指「REM 受剝奪後的補償性增加」；題目描述的線索更符合 Selective attention，而不是此選項。","不符合。State-dependent memory 指「State-dependent memory」；題目描述的線索更符合 Selective attention，而不是此選項。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Medium","skill":"Concept Application","stem":"A person performs a well-practiced route home with little conscious attention to each turn. This illustrates","options":["Effortful encoding","Sleep apnea","Hypnosis","Automatic processing"],"answer":3,"concept":"Automatic processing（自動化處理）能以較少意識資源完成熟練活動。","explanations":["不符合。Effortful encoding 指「需要有意識投入的編碼」；題目描述的線索更符合 Automatic processing，而不是此選項。","不符合。Sleep apnea 指「睡眠期間反覆呼吸中止」；題目描述的線索更符合 Automatic processing，而不是此選項。","不符合。Hypnosis 指「注意與暗示反應改變的催眠」；題目描述的線索更符合 Automatic processing，而不是此選項。","正確。Automatic processing（自動化處理）能以較少意識資源完成熟練活動。"]},{"unit":1,"chapter":"States of Consciousness","difficulty":"Hard","skill":"Concept Application","stem":"A participant in a hypnosis session remains responsive to suggestions but is not unconscious. Which conclusion is most justified?","options":["Hypnosis guarantees accurate recovered memories","Hypnosis is identical to N3 sleep","Hypnosis involves altered attention and suggestibility","Hypnosis always produces total amnesia"],"answer":2,"concept":"Hypnosis（催眠）可能改變注意與暗示接受度，並非必然失去意識。","explanations":["不符合。Hypnosis guarantees accurate recovered memories 指「Hypnosis guarantees accurate recovered memories」；題目描述的線索更符合 Hypnosis involves altered attention and suggestibility，而不是此選項。","不符合。Hypnosis is identical to N3 sleep 指「Hypnosis is identical to N3 sleep」；題目描述的線索更符合 Hypnosis involves altered attention and suggestibility，而不是此選項。","正確。Hypnosis（催眠）可能改變注意與暗示接受度，並非必然失去意識。","不符合。Hypnosis always produces total amnesia 指「Hypnosis always produces total amnesia」；題目描述的線索更符合 Hypnosis involves altered attention and suggestibility，而不是此選項。"]},{"unit":1,"chapter":" 錐狀細胞解釋色覺」；題目描述的線索更符合 Signal detection theory，而不是此選項。","正確。Signal detection theory 同時考量敏感度與判斷標準（response criterion）。"]},{"unit":1,"chapter":"Sensation","difficulty":"Medium","skill":"Concept Application","stem":"After wearing perfume for an hour, a person notices its smell less. Which process is occurring?","options":["Accommodation","Transduction failure","Sensory adaptation","Retinal disparity"],"answer":2,"concept":"Sensory adaptation（感覺適應）使持續刺激的主觀感受降低。","explanations":["不符合。Accommodation 指「水晶體變形以調整焦距」；題目描述的線索更符合 Sensory adaptation，而不是此選項。","不符合。Transduction failure 指「感覺能量轉換障礙」；題目描述的線索更符合 Sensory adaptation，而不是此選項。","正確。Sensory adaptation（感覺適應）使持續刺激的主觀感受降低。","不符合。Retinal disparity 指「雙眼影像差異的深度線索」；題目描述的線索更符合 Sensory adaptation，而不是此選項。"]},{"unit":1,"chapter":"Sensation","difficulty":"Hard","skill":"Concept Application","stem":"Light energy is converted into neural signals in the retina. This conversion is called","options":["Habituation","Transduction","Accommodation","Perception"],"answer":1,"concept":"Transduction（轉導）將外界物理能量轉為神經訊號。","explanations":["不符合。Habituation 指「對重複刺激反應減弱」；題目描述的線索更符合 Transduction，而不是此選項。","正確。Transduction（轉導）將外界物理能量轉為神經訊號。","不符合。Accommodation 指「水晶體變形以調整焦距」；題目描述的線索更符合 Transduction，而不是此選項。","不符合。Perception 指「Perception」；題目描述的線索更符合 Transduction，而不是此選項。"]},{"unit":1,"chapter":"Sensation","difficulty":"Easy","skill":"Concept Application","stem":"A person struggles to see in dim light because a class of retinal receptors is damaged. Which receptors are affected?","options":["Rods","Cones","Ganglion cells only","Bipolar cells only"],"answer":0,"concept":"Rods（桿狀細胞）對低光環境特別敏感。","explanations":["正確。Rods（桿狀細胞）對低光環境特別敏感。","不符合。Cones 指「處理顏色與細節的錐狀細胞」；題目描述的線索更符合 Rods，而不是此選項。","不符合。Ganglion cells only 指「輸出視網膜訊號的神經節細胞」；題目描述的線索更符合 Rods，而不是此選項。","不符合。Bipolar cells only 指「連結受器與神經節細胞的雙極細胞」；題目描述的線索更符合 Rods，而不是此選項。"]},{"unit":1,"chapter":"Sensation","difficulty":"Medium","skill":"Concept Application","stem":"A person has difficulty distinguishing colors in bright daylight. Which retinal receptors are most directly involved?","options":["Rods","Auditory hair cells","Olfactory receptors","Cones"],"answer":3,"concept":"Cones（錐狀細胞）負責色彩與高解析度視覺。","explanations":["不符合。Rods 指「對暗光敏感的桿狀細胞」；題目描述的線索更符合 Cones，而不是此選項。","不符合。Auditory hair cells 指「耳蝸中負責聽覺轉導的毛細胞」；題目描述的線索更符合 Cones，而不是此選項。","不符合。Olfactory receptors 指「鼻腔的嗅覺受器」；題目描述的線索更符合 Cones，而不是此選項。","正確。Cones（錐狀細胞）負責色彩與高解析度視覺。"]},{"unit":1,"chapter":"Sensation","difficulty":"Hard","skill":"Concept Application","stem":"A person looks directly at a tiny printed letter. Which retinal region supports the sharpest detail?","options":["Optic disc","Peripheral retina","Fovea","Blind spot"],"answer":2,"concept":"Fovea（中央凹）錐狀細胞密集，視覺解析度最高。","explanations":["不符合。Optic disc 指「視神經離開眼球的位置」；題目描述的線索更符合 Fovea，而不是此選項。","不符合。Peripheral retina 指「視網膜周邊區域」；題目描述的線索更符合 Fovea，而不是此選項。","正確。Fovea（中央凹）錐狀細胞密集，視覺解析度最高。","不符合。Blind spot 指「視網膜缺少受器的視神經盤」；題目描述的線索更符合 Fovea，而不是此選項。"]},{"unit":1,"chapter":"Sensation","difficulty":"Easy","skill":"Concept Application","stem":"An image falls where the optic nerve leaves the retina, producing no photoreceptor response. This area is the","options":["Cornea","Blind spot","Fovea","Lens"],"answer":1,"concept":"Blind spot（盲點）位於 optic disc，缺乏 photoreceptors。","explanations":["不符合。Cornea 指「眼球前方主要折射光線的角膜」；題目描述的線索更符合 Blind spot，而不是此選項。","正確。Blind spot（盲點）位於 optic disc，缺乏 photoreceptors。","不符合。Fovea 指「視網膜中央凹，精細視覺區」；題目描述的線索更符合 Blind spot，而不是此選項。","不符合。Lens 指「改變形狀協助對焦的水晶體」；題目描述的線索更符合 Blind spot，而不是此選項。"]},{"unit":1,"chapter":"Sensation","difficulty":"Medium","skill":"Concept Application","stem":"A person shifts focus from a distant mountain to a nearby book. The lens changes shape through","options":["Accommodation","Transduction","Dark adaptation","Sensory interaction"],"answer":0,"concept":"Accommodation（調節作用）是水晶體改變曲率以對焦。","explanations":["正確。Accommodation（調節作用）是水晶體改變曲率以對焦。","不符合。Transduction 指「感覺能量轉為神經訊號」；題目描述的線索更符合 Accommodation，而不是此選項。","不符合。Dark adaptation 指「進入暗處後視覺敏感度提升」；題目描述的線索更符合 Accommodation，而不是此選項。","不符合。Sensory interaction 指「不同感覺系統相互影響」；題目描述的線索更符合 Accommodation，而不是此選項。"]},{"unit":1,"chapter":"Sensation","difficulty":"Hard","skill":"Concept Application","stem":"After staring at a red square, a person sees a greenish afterimage on white paper. Which theory best explains this?","options":["Place theory","Gate-control theory","Frequency theory","Opponent-process theory"],"answer":3,"concept":"Opponent-process theory 以對抗色彩通道解釋補色後像。","explanations":["不符合。Place theory 指「基底膜位置與音高編碼」；題目描述的線索更符合 Opponent-process theory，而不是此選項。","不符合。Gate-control theory 指「脊髓調節痛覺訊號」；題目描述的線索更符合 Opponent-process theory，而不是此選項。","不符合。Frequency theory 指「神經放電時間模式與音高」；題目描述的線索更符合 Opponent-process theory，而不是此選項。","正確。Opponent-process theory 以對抗色彩通道解釋補色後像。"]},{"unit":1,"chapter":"Sensation","difficulty":"Easy","skill":"Concept Application","stem":"A theory explains color vision through three types of cone receptors with different spectral sensitivities. Which theory is it?","options":["Place theory","Volley principle","Trichromatic theory","Opponent-process theory"],"answer":2,"concept":"Trichromatic theory（三色論）強調三類錐狀細胞的反應。","explanations":["不符合。Place theory 指「基底膜位置與音高編碼」；題目描述的線索更符合 Trichromatic theory，而不是此選項。","不符合。Volley principle 指「神經群體交替放電編碼頻率」；題目描述的線索更符合 Trichromatic theory，而不是此選項。","正確。Trichromatic theory（三色論）強調三類錐狀細胞的反應。","不符合。Opponent-process theory 指「對抗色彩或對立過程的理論」；題目描述的線索更符合 Trichromatic theory，而不是此選項。"]},{"unit":1,"chapter":"Sensation","difficulty":"Medium","skill":"Concept Application","stem":"A person cannot reliably distinguish certain reds from greens because of cone-related differences. Which sense is affected?","options":["Kinesthesia","Color vision","Sound localization","Vestibular balance"],"answer":1,"concept":"Color vision deficiency 常與錐狀細胞的感光特性差異有關。","explanations":["不符合。Kinesthesia 指「身體部位位置與運動的感覺」；題目描述的線索更符合 Color vision，而不是此選項。","正確。Color vision deficiency 常與錐狀細胞的感光特性差異有關。","不符合。Sound localization 指「Sound localization」；題目描述的線索更符合 Color vision，而不是此選項。","不符合。V ry 指「三類錐狀細胞解釋色覺」；題目描述的線索更符合 Place theory，而不是此選項。","正確。Place theory 以基底膜不同位置的振動解釋音高編碼，尤其是高頻。","不符合。Opponent-process theory 指「對抗色彩或對立過程的理論」；題目描述的線索更符合 Place theory，而不是此選項。","不符合。Gate-control theory 指「脊髓調節痛覺訊號」；題目描述的線索更符合 Place theory，而不是此選項。"]},{"unit":1,"chapter":"Sensation","difficulty":"Easy","skill":"Concept Application","stem":"For low-frequency sounds, auditory neurons’ firing rates help encode pitch. Which theory is relevant?","options":["Frequency theory","Place theory exclusively","Opponent-process theory","Weber’s law"],"answer":0,"concept":"Frequency theory 強調神經放電時間模式與低頻音高的關係。","explanations":["正確。Frequency theory 強調神經放電時間模式與低頻音高的關係。","不符合。Place theory exclusively 指「Place theory exclusively」；題目描述的線索更符合 Frequency theory，而不是此選項。","不符合。Opponent-process theory 指「對抗色彩或對立過程的理論」；題目描述的線索更符合 Frequency theory，而不是此選項。","不符合。Weber’s law 指「差異閾值與原刺激強度的比例關係」；題目描述的線索更符合 Frequency theory，而不是此選項。"]},{"unit":1,"chapter":"Sensation","difficulty":"Medium","skill":"Concept Application","stem":"A person has difficulty hearing because the tiny middle-ear bones no longer transmit vibrations effectively. Which hearing loss is most likely?","options":["Sensorineural hearing loss","Color blindness","Vestibular migraine","Conductive hearing loss"],"answer":3,"concept":"Conductive hearing loss（傳導性聽損）與外耳或中耳傳音問題有關。","explanations":["不符合。Sensorineural hearing loss 指「耳蝸或聽神經損傷」；題目描述的線索更符合 Conductive hearing loss，而不是此選項。","不符合。Color blindness 指「色覺辨識異常」；題目描述的線索更符合 Conductive hearing loss，而不是此選項。","不符合。Vestibular migraine 指「與前庭症狀相關的偏頭痛」；題目描述的線索更符合 Conductive hearing loss，而不是此選項。","正確。Conductive hearing loss（傳導性聽損）與外耳或中耳傳音問題有關。"]},{"unit":1,"chapter":"Sensation","difficulty":"Hard","skill":"Concept Application","stem":"Damage to cochlear hair cells reduces hearing sensitivity. Which type of hearing loss is most likely?","options":["Anosmia","Prosopagnosia","Sensorineural hearing loss","Conductive hearing loss"],"answer":2,"concept":"Sensorineural hearing loss（感音神經性聽損）可源於耳蝸毛細胞受損。","explanations": eraction，而不是此選項。","正確。Sensory interaction（感覺交互作用）使嗅覺與味覺共同影響風味。"]},{"unit":1,"chapter":"Sensation","difficulty":"Easy","skill":"Concept Application","stem":"A researcher studies receptor cells that detect dissolved chemicals on the tongue. Which sense is under study?","options":["Audition","Vision","Gustation","Olfaction"],"answer":2,"concept":"Gustation（味覺）涉及舌部味覺受器對化學物質的反應。","explanations":["不符合。Audition 指「聽覺」；題目描述的線索更符合 Gustation，而不是此選項。","不符合。Vision 指「Vision」；題目描述的線索更符合 Gustation，而不是此選項。","正確。Gustation（味覺）涉及舌部味覺受器對化學物質的反應。","不符合。Olfaction 指「嗅覺」；題目描述的線索更符合 Gustation，而不是此選項。"]},{"unit":1,"chapter":"Sensation","difficulty":"Medium","skill":"Concept Application","stem":"A participant identifies an odor when airborne molecules bind to receptors in the nasal cavity. Which sense is involved?","options":["Vestibular sense","Olfaction","Gustation","Kinesthesia"],"answer":1,"concept":"Olfaction（嗅覺）透過鼻腔嗅覺受器偵測氣味分子。","explanations":["不符合。Vestibular sense 指「Vestibular sense」；題目描述的線索更符合 Olfaction，而不是此選項。","正確。Olfaction（嗅覺）透過鼻腔嗅覺受器偵測氣味分子。","不符合。Gustation 指「味覺」；題目描述的線索更符合 Olfaction，而不是此選項。","不符合。Kinesthesia 指「身體部位位置與運動的感覺」；題目描述的線索更符合 Olfaction，而不是此選項。"]},{"unit":1,"chapter":"Sensation","difficulty":"Hard","skill":"Concept Application","stem":"A person rubs an elbow after bumping it, reducing the experience of pain. Which account helps explain this?","options":["Gate-control theory","Trichromatic theory","Place theory","Weber’s law"],"answer":0,"concept":"Gate-control theory 認為脊髓層級的神經調控可影響痛覺訊號。","explanations":["正確。Gate-control theory 認為脊髓層級的神經調控可影響痛覺訊號。","不符合。Trichromatic theory 指「三類錐狀細胞解釋色覺」；題目描述的線索更符合 Gate-control theory，而不是此選項。","不符合。Place theory 指「基底膜位置與音高編碼」；題目描述的線索更符合 Gate-control theory，而不是此選項。","不符合。Weber’s law 指「差異閾值與原刺激強度的比例關係」；題目描述的線索更符合 Gate-control theory，而不是此選項。"]},{"unit":1,"chapter":"Sensation","difficulty":"Easy","skill":"Concept Application","stem":"A person withdraws a foot from a sharp object because specialized receptors detect tissue-damaging stimulation. These are","options":["Photoreceptors","Chemoreceptors for taste","Auditory hair cells","Nociceptors"],"answer":3,"concept":"Nociceptors（傷害感受器）偵測可能造成組織傷害的刺激。","explanations":["不符合。Photoreceptors 指「感光受器」；題目描述的線索更符合 Nociceptors，而不是此選項。","不符合。Chemoreceptors for taste 指「味覺化學受器」；題目描述的線索更符合 Nociceptors，而不是此選項。","不符合。Auditory hair cells 指「耳蝸中負責聽覺轉導的毛細胞」；題目描述的線索更符合 Nociceptors，而不是此選項。","正確。Nociceptors（傷害感受器）偵測可能造成組織傷害的刺激。"]},{"unit":1,"chapter":"Sensation","difficulty":"Medium","skill":"Data Interpretation","stem":"An experiment presents a weak light on 100 trials: a participant reports seeing it 55 times. Which value is directly observed?","options":["45% correct rejection rate","55% response bias","55% hit rate on signal-present trials","55% false-alarm rate"],"answer":2,"concept":"在有訊號的試次報告看見 55 次，是 hit rate 55%；無訊號試次才能計算 false alarm。","explanations":["不符合。45% correct rejection rate 指「無訊號試次中的 45% 正確拒絕率」；題目描述的線索更符合 55% hit rate on signal-present trials，而不是此選項。","不符合。55% response bias 指「判斷標準或偏誤，不能僅以命中率定義」；題目描述的線索更符合 55% hit rate on signal-present trials，而不是此選項。","正確。在有訊號的試次報告看見 55 次，是 hit rate 55%；無訊號試次才能計算 false alarm。","不符合。55% false-alarm rate 指「無訊號試次中的 55% 誤報率」；題目描述的線索更符合 55% hit rate on signal-present trials，而不是此選項。"]},{"unit":1,"chapter":"Sensation","difficulty":"Hard","skill":"Data Interpretation","stem":"In a sound-detection task, a participant says “yes” on 12 of 40 trials when no sound was played. What is the false-alarm rate?","options":["70%","30%","12%","40%"],"answer":1,"concept":"False-alarm rate = 12 ÷ 40 = 30%；分母是沒有呈現訊號的試次數。","explanations":["不符合。70% 指「命中率或互補比例的混淆」；題目描述的線索更符合 30%，而不是此選項。","正確。False-alarm rate = 12 ÷ 40 = 30%；分母是沒有呈現訊號的試次數。","不符合。12% 指「將次數直接當百分比」；題目描述的線索更符合 30%，而不是此選項。","不符合。40% 指「把無訊號試次數誤當比例」；題目描述的線索更符合 30%，而不是此選項。"]}],KEY='ap_psych_lab_unit_1';let unit=1,active=[],answers={},submitted=false,history=[],wrongIds=[];const $=x=>document.getElementById(x);function safe(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}try{let h=JSON.parse(localStorage.getItem(KEY)||'{}');history=h.history||[];wrongIds=h.wrongIds||[]}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify({history,wrongIds}))}function nav(){}function selectUnit(i){unit=CURRENT_UNIT;nav();$('title').textContent=`Unit ${i} — ${UNITS[i][0]}`;$('chapter').innerHTML='<option value="all">全部章節</option>'+UNITS[i][1].map(c=>`<option value="${safe(c)}">${safe(c)}</option>`).join('');newQuiz()}function shuffle(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function newQuiz(mode='all'){submitted=false;answers={};let ch=$('chapter').value,d=$('difficulty').value,skill=$('skill').value;active=shuffle(BANK.map((q,id)=>({...q,id})).filter(q=>q.unit===unit&&(ch==='all'||q.chapter===ch)&&(d==='all'||q.difficulty===d)&&(skill==='all'||q.skill===skill)&&(mode!=='wrong'||wrongIds.includes(q.id)))).slice(0,Number($('count').value));render()}function choose(id,v){answers[id]=v;let n=active.filter(q=>answers[q.id]!==undefined).length;$('status').textContent=`${n} / ${active.length} 題已作答`;$('bar').style.width=(active.length?n/active.length*100:0)+'%'}function render(){let n=active.filter(q=>answers[q.id]!==undefined).length;$('status').textContent=`${n} / ${active.length} 題已作答`;$('bar').style.width=(active.length?n/active.length*100:0)+'%';$('quiz').innerHTML=active.length?active.map((q,i)=>`<section class="question"><span class="pill">${safe(q.chapter)}</span><span class="pill">${safe(q.difficulty)}</span><span class="pill">${safe(q.skill)}</span><h3>${i+1}. ${safe(q.stem)}</h3>${q.options.map((opt,j)=>`<label class="choice"><input type="radio" name="q${q.id}" ${answers[q.id]===j?'checked':''} ${submitted?'disabled':''} onchange="choose(${q.id},${j})"><span><b>${'ABCD'[j]}.</b> ${safe(opt)}</span></label>`).join('')}${submitted?`<div class="feedback"><b class="${answers[q.id]===q.answer?'good':'bad'}">${answers[q.id]===q.answer?'答對':'需複習'} · 正確答案 ${'ABCD'[q.answer]}</b><p><b>核心概念：</b>${safe(q.concept)}</p>${q.explanations.map((ex,j)=>`<p><b>${'ABCD'[j]} ${j===q.answer?'✓':'✗'}</b> ${safe(ex)}</p>`).join('')}</div>`:''}</section>`).join(''):'<div class="empty">此篩選條件下沒有題目，請調整章節、難度或能力分類。</div>';$('submit').disabled=!active.length||submitted;$('result').innerHTML=submitted?`<div class="result"><h2>本次得分 ${active.filter(q=>answers[q.id]===q.answer).length} / ${active.length}</h2><p>每一題下方皆有四個選項的中文解析與英文專有名詞。</p><button onclick="retryWrong()">重練本次錯題</button> <button onclick="newQuiz()">重新抽題</button></div>`:'';stats()}function submitQuiz(){if(!active.length)return;submitted=true;let correct=active.filter(q=>answers[q.id]===q.answer).length;for(const q of active){if(answers[q.id]!==q.answer){if(!wrongIds.includes(q.id))wrongIds.push(q.id)}else wrongIds=wrongIds.filter(x=>x!==q.id)}history.push({date:new Date().toLocaleString('zh-TW'),unit,chapter:$('chapter').value,correct,total:active.length});save();render();$('result').scrollIntoView({behavior:'smooth',block:'center'})}function retryWrong(){active=active.filter(q=>answers[q.id]!==q.answer);answers={};submitted=false;render()}function stats(){let total=history.reduce((s,x)=>s+x.total,0),correct=history.reduce((s,x)=>s+x.correct,0);$('stats').innerHTML=`<div class="stat">練習次數<strong>${history.length}</strong></div><div class="stat">累積作答<strong>${total}</strong></div><div class="stat">正確率<strong>${total?Math.round(correct/total*100):0}%</strong></div>`;$('history').innerHTML=history.slice(-6).reverse().map(h=>`<div>${safe(h.date)} · Unit ${h.unit} · ${h.correct}/${h.total}</div>`).join('')||'<p class="muted">尚無作答紀錄</p>';$('wrongCount').textContent=wrongIds.length}function resetHistory(){if(confirm('確定刪除本瀏覽器的練習紀錄與錯題清單？')){history=[];wrongIds=[];save();stats()}}window.addEventListener('load',()=>selectUnit(1));</script></body></html>
